<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff5eb" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E5B3D"/>
      <stop offset="100%" stop-color="#3A2011"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glow -->
  <ellipse cx="128" cy="180" rx="50" ry="15" fill="#ffb870" opacity="0.25" filter="url(#glow)"/>

  <!-- Mug Handle -->
  <path d="M170 110 C210 110 210 170 170 170" fill="none" stroke="url(#glass)" stroke-width="12" stroke-linecap="round"/>

  <!-- Coffee Liquid -->
  <path d="M76 100 Q128 108 180 100 L180 170 C180 190 160 200 128 200 C96 200 76 190 76 170 Z" fill="url(#coffee)"/>

  <!-- Mug Body -->
  <path d="M70 80 L186 80 L186 170 C186 196 160 206 128 206 C96 206 70 196 70 170 Z" fill="url(#glass)" stroke="#2a2340" stroke-width="6" stroke-linejoin="round"/>

  <!-- Liquid Surface -->
  <ellipse cx="128" cy="100" rx="52" ry="12" fill="#5A341E" stroke="#A97350" stroke-width="3"/>

  <!-- Steam / Bubbles -->
  <g fill="#ffdfc2" opacity="0.8">
    <circle cx="100" cy="50" r="5" filter="url(#glow)"/>
    <circle cx="125" cy="35" r="4" filter="url(#glow)"/>
    <circle cx="145" cy="60" r="6" filter="url(#glow)"/>
    <circle cx="115" cy="70" r="3"/>
  </g>

  <!-- Glass shine -->
  <path d="M85 95 C85 130 95 180 110 190" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Sparkles -->
  <g stroke="#ffc080" stroke-width="3" stroke-linecap="round">
    <path d="M48 64v8M44 68h8"/>
    <path d="M208 40v8M204 44h8"/>
    <path d="M185 186v6M182 189h6"/>
  </g>
</svg>
