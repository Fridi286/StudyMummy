services:
  web:
    # Override the default command to enable Uvicorn hot-reloading
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Explicitly bind mount the app directory to allow Uvicorn to watch for file changes
      - ./backend/app:/app/app
      # Persist uploaded avatars across container restarts
      - ./backend/static:/app/static
