services:
  # ==========================================
  # SHARED SERVICES (Runs in both Dev and Prod)
  # ==========================================
  db:
    image: pgvector/pgvector:pg15
    container_name: studymummy_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studymummy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization script to auto-run on container start
      - ./backend/app/db/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d studymummy" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # DEV PROFILE (Hot-reloading & Open Ports)
  # Run with: docker compose --profile dev up
  # ==========================================
  web-dev:
    profiles: [ "dev" ]
    build: ./backend
    container_name: studymummy_web_dev
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=StudyMummy API
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-studymummy}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - HAW_ICC_API_KEY=${HAW_ICC_API_KEY}
      - HAW_ICC_BASE_URL=${HAW_ICC_BASE_URL:-https://llm.inf.haw-hamburg.de/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - SECRET_KEY=${SECRET_KEY:-development-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Live code reloading during development
      - ./backend/app:/app/app
      # Persist uploaded avatars across container restarts
      - ./backend/static:/app/static

  frontend-dev:
    profiles: [ "dev" ]
    build: ./frontend
    container_name: studymummy_frontend_dev
    restart: always
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for live-reloading inside Docker
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overwriting the container's
    depends_on:
      - web-dev

  # ==========================================
  # PROD PROFILE (Locked Down & Cloudflare SSL)
  # Run with: docker compose --profile prod up -d
  # ==========================================
  web-prod:
    profiles: [ "prod" ]
    build: ./backend
    container_name: studymummy_web_prod
    restart: always
    # No external ports exposed to the host server for security
    environment:
      - APP_NAME=StudyMummy API
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-studymummy}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - HAW_ICC_API_KEY=${HAW_ICC_API_KEY}
      - HAW_ICC_BASE_URL=${HAW_ICC_BASE_URL:-https://llm.inf.haw-hamburg.de/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production_use_a_32_plus_byte_random_hex_string_here}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Only persist user-uploaded avatars; item images stay baked into the image
      - backend_static:/app/static/avatars

  frontend-prod:
    profiles: [ "prod" ]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: studymummy_frontend_prod
    restart: always
    # No external ports exposed to the host server for security
    depends_on:
      - web-prod

  cloudflared:
    profiles: [ "prod" ]
    image: cloudflare/cloudflared:latest
    container_name: studymummy_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web-prod
      - frontend-prod

volumes:
  postgres_data:
  backend_static:
