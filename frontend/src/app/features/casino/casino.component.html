<div
  class="flex-1 w-full flex flex-col items-center pt-8 pb-4 px-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-100 via-white to-slate-50 h-full">

  @if (!activeGame()) {
  <div class="text-center mb-8">
    <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight mb-2">Casino Hub</h1>
    <p class="text-slate-500 font-medium">Choose a game to play!</p>
  </div>

  <div class="w-full max-w-lg">

    <!-- Slot Machine Card -->
    <div (click)="selectGame('slots')"
      class="bg-white rounded-3xl p-10 border border-indigo-100 shadow-xl cursor-pointer hover:-translate-y-2 hover:shadow-2xl transition-all duration-300 group text-center">
      <div
        class="w-24 h-24 bg-indigo-50 rounded-2xl flex items-center justify-center text-5xl mb-6 group-hover:scale-110 transition-transform mx-auto">
        🎰
      </div>
      <h2 class="text-3xl font-bold text-slate-800 mb-3">Study Slots</h2>
      <p class="text-lg text-slate-500 font-medium">Spin the reels and match study emojis to win massive payouts!</p>
    </div>

  </div>
  } @else if (activeGame() === 'slots') {
  <app-slots (leave)="leaveGame()"></app-slots>
  }
</div>
