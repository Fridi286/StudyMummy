
<!-- Back Button -->
<div class="w-full max-w-5xl mb-2 flex justify-start">
  <p-button label="Back to Hub" icon="pi pi-arrow-left" severity="secondary" variant="text"
    (onClick)="onLeave()"></p-button>
</div>

<div class="w-full max-w-5xl">
  <div class="shadow-2xl border border-indigo-100 rounded-3xl p-6 sm:p-10 bg-white/90 backdrop-blur-md">

    <!-- Slot Machine Display -->
    <div
      class="bg-slate-50 rounded-2xl p-6 sm:p-10 mb-8 border border-slate-200 shadow-inner relative overflow-hidden mx-auto w-full max-w-4xl">

      <div class="grid grid-cols-3 gap-4">
        @for (reel of reels(); track $index) {
        <div
          class="bg-white rounded-xl aspect-square flex items-center justify-center shadow-sm border border-slate-100 relative overflow-hidden">

          <span class="text-5xl md:text-6xl drop-shadow-md select-none transition-transform"
            [ngClass]="{'animate-bounce': isSpinning(), 'scale-90': !isSpinning()}">
            {{ reel }}
          </span>
        </div>
        }
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col gap-4">

      <!-- Bet Amount -->
      <div class="flex flex-col gap-2 items-center">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Bet Amount</label>
        <div class="flex gap-2 justify-center flex-wrap">
          <p-button label="Min" size="small" severity="secondary" variant="text" (onClick)="setBet(10)"
            [disabled]="isSpinning()"></p-button>
          <p-inputnumber [(ngModel)]="betAmount" [min]="1" [max]="userCoins() || 1" [showButtons]="true"
            buttonLayout="horizontal" spinnerMode="horizontal" decrementButtonClass="p-button-secondary p-button-text"
            incrementButtonClass="p-button-secondary p-button-text" incrementButtonIcon="pi pi-plus"
            decrementButtonIcon="pi pi-minus"
            inputStyleClass="w-24 text-center font-bold text-slate-700 bg-slate-50 border-none"
            [disabled]="isSpinning()">
          </p-inputnumber>
          <p-button label="Max" size="small" severity="secondary" variant="text" (onClick)="setBet(userCoins() || 10)"
            [disabled]="isSpinning()"></p-button>
        </div>
      </div>

      <!-- Balance Display -->
      <div class="text-center text-sm font-bold text-slate-500">
        Your Balance: <span class="text-amber-600 ml-1">{{ userCoins() }} <i class="pi pi-star-fill text-xs"></i></span>
      </div>

      <!-- Spin Button -->
      <p-button [label]="isSpinning() ? 'SPINNING...' : 'SPIN!'" [disabled]="isSpinning()" (onClick)="spin()"
        styleClass="w-full py-3 text-2xl font-black rounded-2xl shadow-xl transition-transform hover:-translate-y-1 active:translate-y-1"
        [style]="{'background': isSpinning() ? '#94a3b8' : 'linear-gradient(to right, #4f46e5, #7c3aed)', 'border': 'none'}">
      </p-button>

    </div>
  </div>
</div>
