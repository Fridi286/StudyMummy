<div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/5 rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>

@if (tasks().length === 0) {
  <div class="flex-1 flex flex-col items-center justify-center text-center p-5 sm:p-8">
    <div class="w-24 h-24 bg-emerald-50 text-emerald-400 rounded-3xl flex items-center justify-center text-5xl mb-5 shadow-inner border-[4px] border-white z-10">
      <i class="pi pi-check-square"></i>
    </div>
    <h2 class="text-2xl font-extrabold text-slate-800 mb-2 z-10">Study Tasks</h2>
    <p class="text-sm text-slate-500 max-w-sm z-10">No tasks generated for this document yet.</p>
  </div>
} @else {
  <div class="w-full h-full overflow-y-auto text-left z-10">
    <div class="p-5 sm:p-8 space-y-3">
      @for (task of tasks(); track task.task_id) {
      <div class="bg-white border hover:border-emerald-300 transition-all rounded-xl p-5 shadow-sm flex flex-col sm:flex-row gap-4 items-start"
           [ngClass]="task.status === 'completed' ? 'border-emerald-200 opacity-75' : 'border-slate-200'">
        
        <!-- Interactive Checkbox -->
        <button (click)="taskToggle.emit(task)"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-base shrink-0 font-bold transition-colors border-2 mt-0.5"
                [ngClass]="task.status === 'completed' ? 'bg-emerald-500 border-emerald-500 text-white shadow-inner' : 'bg-white border-slate-300 text-slate-300 hover:border-emerald-400 hover:text-emerald-400'">
          <i class="pi pi-check"></i>
        </button>
        
        <div class="flex-1 min-w-0">
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-2 mb-2.5">
            <h3 class="text-base font-bold leading-snug transition-all"
                [ngClass]="task.status === 'completed' ? 'text-slate-400 line-through' : 'text-slate-800'">
              {{ task.task_text }}
            </h3>
            <span class="px-2.5 py-1 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-full text-[10px] uppercase tracking-wide font-bold whitespace-nowrap mt-1 sm:mt-0">
              Difficulty: {{ task.difficulty }}/5
            </span>
          </div>
          <div class="flex gap-1.5 flex-wrap">
            @for (concept of task.key_concepts; track concept) {
              <span class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-md text-[11px] font-medium text-slate-600">
                {{ concept }}
              </span>
            }
          </div>
        </div>
      </div>
    }
    </div>
  </div>
}
