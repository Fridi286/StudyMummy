<p-dialog [visible]="visible" (visibleChange)="close()" [modal]="true" [style]="{width: '65vw', 'max-width': '800px'}" [breakpoints]="{'960px': '95vw'}" styleClass="rounded-3xl overflow-hidden shadow-[0_20px_60px_-15px_rgba(0,0,0,0.3)] border border-white/40">
  <ng-template pTemplate="header">
    <div class="w-full flex justify-between items-center">
      <h3 class="font-extrabold text-xl text-slate-800 tracking-tight flex items-center gap-2 m-0">
        <i class="pi pi-sync text-indigo-500 animate-[spin_4s_linear_infinite]"></i> Trade with <span class="text-indigo-600">{{targetUser?.username}}</span>
      </h3>
    </div>
  </ng-template>

  <div *ngIf="targetUser" class="flex flex-col gap-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- You Offer -->
      <div class="rounded-2xl p-5 bg-gradient-to-br from-indigo-50/50 to-white border border-indigo-100 shadow-sm relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
        <h4 class="font-bold mb-5 text-indigo-800 flex items-center gap-2 text-lg">
          <i class="pi pi-arrow-up-right p-2 bg-indigo-100 text-indigo-600 rounded-full text-xs"></i> You Offer
        </h4>
        
        <div class="mb-5 relative z-10">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Coins</label>
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon bg-white border-indigo-200 text-yellow-500"><i class="pi pi-stop-circle"></i></span>
            <p-inputNumber [(ngModel)]="offerCoins" [min]="0" mode="decimal" styleClass="w-full" [inputStyle]="{'border-color': '#e0e7ff'}"></p-inputNumber>
          </div>
        </div>
        
        <div class="relative z-10">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Your Items</label>
          <div class="max-h-56 overflow-y-auto flex flex-col gap-2 pr-2 custom-scrollbar">
            <div *ngFor="let inv of myInventory()" class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-indigo-50 transition-all hover:shadow-md hover:border-indigo-100">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center border border-gray-100">
                  <img *ngIf="inv.item.icon_url" [src]="'http://localhost:8000' + inv.item.icon_url" class="w-7 h-7 object-contain">
                  <i *ngIf="!inv.item.icon_url" class="pi pi-box text-gray-400 text-lg"></i>
                </div>
                <div>
                  <div class="text-sm font-bold text-gray-800">{{inv.item.name}}</div>
                  <div class="text-xs text-gray-500 font-medium">Owned: {{inv.quantity}}</div>
                </div>
              </div>
              <div class="flex items-center bg-gray-50 rounded-lg border border-gray-100 p-0.5">
                <p-button icon="pi pi-minus" [text]="true" size="small" styleClass="w-8 h-8 p-0" (onClick)="changeOfferItem(inv.item.item_id, -1, inv.quantity)"></p-button>
                <span class="w-8 text-center font-bold text-indigo-700">{{offerItems()[inv.item.item_id] || 0}}</span>
                <p-button icon="pi pi-plus" [text]="true" size="small" styleClass="w-8 h-8 p-0" (onClick)="changeOfferItem(inv.item.item_id, 1, inv.quantity)"></p-button>
              </div>
            </div>
            <div *ngIf="myInventory().length === 0" class="text-sm text-gray-400 p-4 text-center bg-white/50 rounded-xl border border-dashed border-gray-200">No items available to offer</div>
          </div>
        </div>
      </div>
      
      <!-- You Request -->
      <div class="rounded-2xl p-5 bg-gradient-to-br from-emerald-50/50 to-white border border-emerald-100 shadow-sm relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
        <h4 class="font-bold mb-5 text-emerald-800 flex items-center gap-2 text-lg">
          <i class="pi pi-arrow-down-left p-2 bg-emerald-100 text-emerald-600 rounded-full text-xs"></i> You Request
        </h4>
        
        <div class="mb-5 relative z-10">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Coins</label>
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon bg-white border-emerald-200 text-yellow-500"><i class="pi pi-stop-circle"></i></span>
            <p-inputNumber [(ngModel)]="requestCoins" [min]="0" mode="decimal" styleClass="w-full" [inputStyle]="{'border-color': '#d1fae5'}"></p-inputNumber>
          </div>
        </div>
        
        <div class="relative z-10">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Their Items</label>
          <div class="max-h-56 overflow-y-auto flex flex-col gap-2 pr-2 custom-scrollbar">
            <div *ngFor="let inv of friendInventory()" class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-emerald-50 transition-all hover:shadow-md hover:border-emerald-100">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center border border-gray-100">
                  <img *ngIf="inv.item.icon_url" [src]="'http://localhost:8000' + inv.item.icon_url" class="w-7 h-7 object-contain">
                  <i *ngIf="!inv.item.icon_url" class="pi pi-box text-gray-400 text-lg"></i>
                </div>
                <div>
                  <div class="text-sm font-bold text-gray-800">{{inv.item.name}}</div>
                  <div class="text-xs text-gray-500 font-medium">They own: {{inv.quantity}}</div>
                </div>
              </div>
              <div class="flex items-center bg-gray-50 rounded-lg border border-gray-100 p-0.5">
                <p-button icon="pi pi-minus" [text]="true" size="small" styleClass="w-8 h-8 p-0" (onClick)="changeRequestItem(inv.item.item_id, -1, inv.quantity)"></p-button>
                <span class="w-8 text-center font-bold text-emerald-700">{{requestItems()[inv.item.item_id] || 0}}</span>
                <p-button icon="pi pi-plus" [text]="true" size="small" styleClass="w-8 h-8 p-0" (onClick)="changeRequestItem(inv.item.item_id, 1, inv.quantity)"></p-button>
              </div>
            </div>
            <div *ngIf="friendInventory().length === 0" class="text-sm text-gray-400 p-4 text-center bg-white/50 rounded-xl border border-dashed border-gray-200">They have no items to request</div>
          </div>
        </div>
      </div>
      
    </div>
    
    <div class="flex justify-end gap-3 mt-2">
      <p-button label="Cancel" [text]="true" severity="secondary" styleClass="rounded-xl px-6" (onClick)="close()"></p-button>
      <button class="flex items-center gap-2 bg-gradient-to-br from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-[0_8px_16px_-4px_rgba(99,102,241,0.4)] hover:shadow-[0_12px_20px_-4px_rgba(99,102,241,0.5)] hover:-translate-y-0.5 border-0" (click)="submitTrade()">
        <i class="pi pi-paperclip"></i> Send Proposal
      </button>
    </div>
  </div>
</p-dialog>
