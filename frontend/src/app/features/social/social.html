<div class="flex flex-col md:flex-row h-[calc(100vh-6rem)] w-full gap-4 max-w-7xl mx-auto p-4">
  
  <!-- Left Panel: Friends & Search -->
  <div class="h-full w-full md:w-1/3 md:min-w-[300px]" [ngClass]="activeChatroom() ? 'hidden md:block' : 'block'">
    <app-social-sidebar 
      class="flex flex-col gap-5 h-full overflow-hidden"
      [activeRoomId]="activeChatroom()?.room_id"
      (roomSelected)="onRoomSelected($event)">
    </app-social-sidebar>
  </div>

  <!-- Right Panel: Active Chat Interface -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex-col overflow-hidden h-full w-full md:flex-1" [ngClass]="activeChatroom() ? 'flex' : 'hidden md:flex'">
    <app-chat-window 
      class="flex flex-col h-full"
      [room]="activeChatroom()" 
      (openTrade)="openTradeModal($event)"
      (removeFriend)="onRemoveFriend($event)"
      (backToFriends)="onRoomSelected(null)">
    </app-chat-window>
  </div>
</div>

<!-- Trade Dialog -->
<app-trade-dialog 
  [visible]="displayTradeModal()"
  (visibleChange)="displayTradeModal.set($event)"
  [targetUser]="tradeFriend()"
  (tradeProposed)="onTradeProposed()">
</app-trade-dialog>
