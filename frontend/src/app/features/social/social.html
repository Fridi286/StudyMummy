<div class="flex h-[calc(100vh-6rem)] w-full gap-4 max-w-7xl mx-auto p-4">
  
  <!-- Left Panel: Friends & Search -->
  <div class="w-1/3 min-w-[300px] h-full">
    <app-social-sidebar 
      class="flex flex-col gap-5 h-full overflow-hidden"
      [activeRoomId]="activeChatroom()?.room_id"
      (roomSelected)="onRoomSelected($event)">
    </app-social-sidebar>
  </div>

  <!-- Right Panel: Active Chat Interface -->
  <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
    <app-chat-window 
      class="flex flex-col h-full"
      [room]="activeChatroom()" 
      (openTrade)="openTradeModal($event)"
      (removeFriend)="onRemoveFriend($event)">
    </app-chat-window>
  </div>
</div>

<!-- Trade Dialog -->
<app-trade-dialog 
  [visible]="displayTradeModal()"
  (visibleChange)="displayTradeModal.set($event)"
  [targetUser]="tradeFriend()"
  (tradeProposed)="onTradeProposed()">
</app-trade-dialog>
