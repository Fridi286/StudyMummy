<p-dialog 
  header="Edit Semantic Tags"
  [(visible)]="visible"
  [modal]="true" 
  [style]="{width: '600px', maxWidth: '90vw'}">
  
  <div class="flex flex-col gap-4 py-4">
    <p class="text-sm text-slate-500">
      Managing tags for <strong class="text-slate-700 font-semibold">{{ document()?.file_name }}</strong>. 
      These tags are used by the AI to retrieve your document during Socratic chat.
    </p>
    
    <div class="w-full mt-2">
      <p-autoComplete 
        [(ngModel)]="editTagsValue" 
        [multiple]="true" 
        [typeahead]="false" 
        placeholder="Type a tag and press Enter...">
      </p-autoComplete>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="visible.set(false)"></p-button>
    <p-button label="Save Changes" icon="pi pi-check" [text]="true" [loading]="isSaving()" (onClick)="saveTags()"></p-button>
  </ng-template>
</p-dialog>
